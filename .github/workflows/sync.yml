name: Sync Notion Portfolio
on:
  schedule:
    - cron: '0 0 * * *'  # daily at midnight UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run portfolio import
        run: python generate_portfolio.py --all
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PORTFOLIO_DATABASE_ID: ${{ secrets.PORTFOLIO_DATABASE_ID }}
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: Automated Notion portfolio sync
